     S.items.push(it);made.push(it)}
    go.textContent="Publishing...";await save();
   }catch(e){
    S.items=S.items.filter(function(x){return made.indexOf(x)<0});
    formMsg(e&&e.code==="conflict"?"Someone else saved first. The page is reloading.":"Upload stopped: "+((e&&e.message)||"please try again."));
   }
   go.disabled=false;go.textContent="Add to library"})}
});
document.addEventListener("change",function(ev){
 var t=ev.target;if(t.id!=="f-file"&&t.id!=="f-cover")return;
 var fs=t.files||[],el=document.getElementById(t.id+"-name");if(!el)return;
 el.textContent=!fs.length?"No file chosen":(fs.length>1?fs.length+" files selected":fs[0].name+" ("+(fs[0].size/1048576).toFixed(1)+" MB)");
 formMsg("");
});

var limited=false;
render();
(async function(){
 try{
  if(!window.claude||!window.claude.use)return;
  var u=await window.claude.use("user");
  canEdit=!!(u&&(u.isOwner()||u.canEdit()));
  if(canEdit){assets=await window.claude.use("assets");artifact=await window.claude.use("artifact");if(!assets||!artifact){canEdit=false;limited=true}}
  if(canEdit||limited)render();
 }catch(e){}
})();
})();
