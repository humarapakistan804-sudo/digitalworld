   ctx.strokeStyle="rgba(84,214,255,.22)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,gR,0,6.2832);ctx.stroke();
   for(k=0;k<pts.length;k++){var P=pts[k],x=P[0]*cr+P[2]*sr,z=-P[0]*sr+P[2]*cr,yy=P[1]*ct-z*st,z2=P[1]*st+z*ct,al=z2>0?.3+.7*z2:.1,sz=z2>0?1.9:1.1;
    ctx.fillStyle=(k%3?"rgba(84,214,255,":"rgba(245,184,46,")+al.toFixed(2)+")";ctx.fillRect(cx+x*gR-sz/2,cy+yy*gR-sz/2,sz,sz)}
  }
  for(e=0;e<(o.orbit||2);e++){
   var tl=e*1.05,ph=now*(.0011+e*.0004)+e*2.1,ra=gR*(o.globe?1.18:1.35),rb=ra*.34;
   for(k=0;k<14;k++){var pp=ph-k*.07,ox=Math.cos(pp)*ra,oy=Math.sin(pp)*rb,rx=ox*Math.cos(tl)-oy*Math.sin(tl),ry=ox*Math.sin(tl)+oy*Math.cos(tl);
    ctx.fillStyle=(e%2?"rgba(198,91,255,":"rgba(84,214,255,")+(1-k/14).toFixed(2)+")";ctx.beginPath();ctx.arc(cx+rx,cy+ry,Math.max(1,R*.02*(1-k/20)),0,6.2832);ctx.fill()}}
  if(now>next){bolt(now,R,ir*.98);next=now+o.gap[0]+Math.random()*(o.gap[1]-o.gap[0])}
  ctx.lineCap="round";ctx.lineJoin="round";
  for(j=bolts.length-1;j>=0;j--){
   var B=bolts[j],age=(now-B.t)/B.life;if(age>=1){bolts.splice(j,1);continue}
   var a2=(1-age)*(Math.random()<.18?.45:1);
   ctx.strokeStyle="rgba("+B.c+","+a2.toFixed(2)+")";ctx.shadowColor="rgba("+B.c+",.9)";ctx.shadowBlur=10;ctx.lineWidth=Math.max(1,R*(B.thin?.008:.014));
   ctx.beginPath();for(k=0;k<B.p.length;k++){var X=cx+B.p[k][0],Y=cy+B.p[k][1];k?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.stroke()}

function makeRain(cv){
 var cols=[];
 return loop(cv,function(ctx,W,H,now){
  var cw=22,n=Math.ceil(W/cw),i,k;
  while(cols.length<n)cols.push({y:Math.random()*H,v:18+Math.random()*30});cols.length=n;
  ctx.font="13px 'DM Mono',monospace";ctx.textBaseline="top";
  for(i=0;i<n;i++){var c=cols[i];c.y=(c.y+c.v*.033)%(H+160);
   for(k=0;k<7;k++){var yy=c.y-k*16;if(yy<-16||yy>H)continue;
    ctx.fillStyle=(i%4?"rgba(84,214,255,":"rgba(245,184,46,")+((1-k/7)*.15).toFixed(2)+")";
    ctx.fillText(((i*7+k+Math.floor(now/900))%2)?"1":"0",i*cw,yy)}}
 })}

async function save(){
 stateEl.textContent=JSON.stringify(S).replace(/</g,"\\u003c");
 var clone=document.body.cloneNode(true);
 ["app","overlay","toast"].forEach(function(id){var e=clone.querySelector("#"+id);if(e){e.innerHTML="";e.className=""}});
 var html='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+clone.innerHTML+'</body></html>';
 await artifact.publish(html);
}
async function guarded(fn){
 if(busy)return;busy=true;
 try{await fn()}catch(e){
  var code=e&&e.code;
  if(code==="conflict")toast("Someone else saved first. The page is reloading.");
  else if(code==="not_granted"||code==="not_writer")toast("You do not have permission to edit this site.");
  else toast("Could not save: "+((e&&e.message)||"please try again"));
 }
 busy=false;
}
function uid(){return"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-act]");
 if(!t){if(ev.target===ov)closeOv();return}
 var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
 if(a==="cat"){filter=(filter===id&&id!=="all")?"all":id;render();if(ev.target.closest(".cat")){document.getElementById("work").scrollIntoView({behavior:"smooth"})}}
 else if(a==="clear"){filter="all";query="";render()}
 else if(a==="open")openItem(id);
 else if(a==="close")closeOv();
 else if(a==="admin")adminPanel();
 else if(a==="theme"){var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);r.setAttribute("data-theme",dark?"light":"dark")}
 else if(a==="del"&&canEdit){guarded(async function(){
   var it=S.items.filter(function(x){return x.id===id})[0];if(!it)return;
   S.items=S.items.filter(function(x){return x.id!==id});
   toast("Removing...");
   for(var k=0;k<(it.assetIds||[]).length;k++){try{await assets.delete(it.assetIds[k])}catch(e){}}
   await save()})}
});

 if(ev.target.id==="setForm"){guarded(async function(){S.settings.whatsapp=document.getElementById("s-wa").value.replace(/\D/g,"");toast("Saving...");await save()})}
 if(ev.target.id==="addForm"){guarded(async function(){
   var title=document.getElementById("f-title").value.trim(),f=document.getElementById("f-file").files[0],cv=document.getElementById("f-cover").files[0],
       link=safeUrl(document.getElementById("f-link").value),price=Math.max(0,Number(document.getElementById("f-price").value)||0);
   if(!title)return;
   if(!f&&!link&&!cv){toast("Add a file, a cover image or a link first.");return}
   if(link===""&&document.getElementById("f-link").value.trim()){toast("The link must start with https://");return}
   var btn=document.getElementById("f-go");btn.disabled=true;btn.textContent="Uploading...";
   var it={id:uid(),title:title,cat:document.getElementById("f-cat").value,price:price,desc:document.getElementById("f-desc").value.trim(),link:link,ts:Date.now(),assetIds:[]};
   try{
    if(f){var r=await assets.upload(f);it.url=r.url;it.assetIds.push(r.id);it.kind=(f.type||"").indexOf("audio")===0?"audio":((f.type||"").indexOf("image")===0?"image":"video")}
    if(cv){var r2=await assets.upload(cv);it.cover=r2.url;it.assetIds.push(r2.id)}
   }catch(e){btn.disabled=false;btn.textContent="Add to library";throw e}
   S.items.push(it);toast("Publishing...");await save()})}
});
