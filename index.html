/* Layout: sticky bar, short hero with orbit globe, 7 colour-coded category tiles, filterable library grid, owner-only upload panel. */
:root{

button{font:inherit;color:inherit;cursor:pointer}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;min-height:42px}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:44px 28px}

/* overlay + panels */
#overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,14,13,.72);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}

  if(!window.claude||!window.claude.use)return;
