<style>
/* Layout: sticky bar, short hero with orbit globe, 7 colour-coded category tiles, filterable library grid, owner-only upload panel. */
:root{

*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px 12px;padding-block:10px;flex-wrap:wrap}

.nav{display:flex;gap:4px}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem;color:var(--muted)}
.nav a:hover{color:var(--ink);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.btn.primary:hover{filter:brightness(1.06)}

[id]{scroll-margin-top:124px}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding-block:44px 28px}
.hero h1{font-size:clamp(2.4rem,6.4vw,4.6rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--jade)}
.hero p.lead{margin-top:16px;max-width:52ch;color:var(--muted);font-size:1.1rem}
.search{margin-top:24px;display:flex;gap:8px;max-width:520px}
.search input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:46px;font:inherit}
.globe{width:100%;max-width:300px;justify-self:center;color:var(--jade)}
.globe .m{transform-box:fill-box;transform-origin:center;animation:sway 9s ease-in-out infinite alternate}

.card{--c:hsl(var(--h) var(--cs) var(--cl));background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}

.play{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.play svg{width:18px;height:18px;margin-left:2px}
.badge{position:absolute;right:10px;top:10px;background:var(--sun);color:#1b1300;border-radius:8px;padding:3px 9px;font-family:var(--mono);font-size:.78rem;font-weight:500}
.badge.free{background:var(--bg);color:var(--ink)}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.cbody .tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.cbody h3{font-size:1.12rem;font-weight:600;overflow-wrap:anywhere}
.cbody p{color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.cbody .row{margin-top:auto;padding-top:6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.price{font-family:var(--display);font-weight:800;font-size:1.15rem}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{font-size:1.4rem}
.empty p{color:var(--muted);max-width:46ch}

/* overlay + panels */
#overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(3,14,13,.72);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}

.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}

.items{display:grid;gap:8px}

.note{background:color-mix(in oklab,var(--sun) 16%,var(--surface));border:1px solid color-mix(in oklab,var(--sun) 50%,var(--line));border-radius:10px;padding:10px 12px;font-size:.92rem}

     S.items.push(it);made.push(it)}
    go.textContent="Publishing...";await save();
   }catch(e){
    S.items=S.items.filter(function(x){return made.indexOf(x)<0});
    formMsg(e&&e.code==="conflict"?"Someone else saved first. The page is reloading.":"Upload stopped: "+((e&&e.message)||"please try again."));
   }
   go.disabled=false;go.textContent="Add to library"})}
});
document.addEventListener("change",function(ev){
 var t=ev.target;if(t.id!=="f-file"&&t.id!=="f-cover")return;
 var fs=t.files||[],el=document.getElementById(t.id+"-name");if(!el)return;
 el.textContent=!fs.length?"No file chosen":(fs.length>1?fs.length+" files selected":fs[0].name+" ("+(fs[0].size/1048576).toFixed(1)+" MB)");
 formMsg("");
});

var limited=false;
render();
(async function(){
 try{
  if(!window.claude||!window.claude.use)return;
  var u=await window.claude.use("user");
  canEdit=!!(u&&(u.isOwner()||u.canEdit()));
  if(canEdit){assets=await window.claude.use("assets");artifact=await window.claude.use("artifact");if(!assets||!artifact){canEdit=false;limited=true}}
  if(canEdit||limited)render();
 }catch(e){}
})();
})();
