name: Sync YouTube videos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "youtube-config.json"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the channel
        run: python3 scripts/sync_youtube.py
      - name: Save changes
        run: |
          git config user.name "digital-world-bot"
          git config user.email "bot@users.noreply.github.com"
          git add youtube.json
          git diff --cached --quiet || (git commit -m "Update YouTube videos" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
